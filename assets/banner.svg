<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bubble {
      animation: float 6s ease-in-out infinite alternate;
    }
    .bubble-delayed {
      animation: float 8s ease-in-out infinite alternate-reverse;
    }
    .pulse-dot {
      animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .wave-line {
      stroke-dasharray: 8 6;
      animation: dashMove 20s linear infinite;
    }
    .grid-glow {
      animation: shimmer 10s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.02); }
      100% { transform: translateY(6px) scale(0.98); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.95); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0% { opacity: 0.15; }
      50% { opacity: 0.35; }
      100% { opacity: 0.15; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glows in Background (Behind Text) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="180" r="220" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>

  <!-- Animated Tech Connection Lines (Background) -->
  <g opacity="0.25" class="grid-glow">
    <path d="M 50 300 Q 300 240 600 300 T 1150 250" fill="none" stroke="#38bdf8" stroke-width="1.5" class="wave-line"/>
    <path d="M 80 80 Q 400 140 800 60 T 1120 120" fill="none" stroke="#818cf8" stroke-width="1.5" class="wave-line" style="animation-duration: 15s;"/>
  </g>

  <!-- Dynamic Floating Decorative Chat Nodes (Positioned on flanks away from center text) -->
  <!-- Left Side Floating Card -->
  <g class="bubble" transform="translate(60, 90)">
    <rect width="180" height="56" rx="14" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="28" r="12" fill="#10b981"/>
    <path d="M24 28 L27 31 L33 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="19" width="70" height="7" rx="3.5" fill="#94a3b8"/>
    <rect x="50" y="31" width="100" height="6" rx="3" fill="#64748b"/>
    <!-- Small Ping Dot -->
    <circle cx="160" cy="28" r="4" fill="#38bdf8" class="pulse-dot"/>
  </g>

  <!-- Left Side Bottom Badge -->
  <g class="bubble-delayed" transform="translate(100, 220)">
    <rect width="140" height="46" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1"/>
    <text x="20" y="28" fill="#38bdf8" font-size="16">💬</text>
    <text x="45" y="28" fill="#e2e8f0" font-size="12" font-weight="600">Omnichannel</text>
  </g>

  <!-- Right Side Floating Chat Bubble -->
  <g class="bubble-delayed" transform="translate(950, 80)">
    <rect width="190" height="64" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.2" filter="url(#subtleGlow)"/>
    <circle cx="32" cy="32" r="14" fill="#6366f1"/>
    <text x="24" y="37" fill="#ffffff" font-size="14">🤖</text>
    <rect x="56" y="21" width="80" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="56" y="35" width="110" height="7" rx="3.5" fill="#94a3b8"/>
  </g>

  <!-- Right Side Bottom Support Node -->
  <g class="bubble" transform="translate(930, 210)">
    <rect width="200" height="52" rx="14" fill="#1e293b" fill-opacity="0.65" stroke="#475569" stroke-width="1"/>
    <circle cx="28" cy="26" r="10" fill="#f59e0b"/>
    <path d="M28 20 L28 28 M28 31 L28.01 31" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="25" fill="#f8fafc" font-size="12" font-weight="600">Live Support &amp; AI</text>
    <text x="48" y="39" fill="#94a3b8" font-size="10">24/7 Real-Time Sync</text>
  </g>

  <!-- FOREGROUND: Clean Central Content (Guaranteed Visible & Crisp) -->
  <g text-anchor="middle">
    <!-- Top Category Pill -->
    <g transform="translate(600, 68)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e1e38" stroke="#6366f1" stroke-width="1"/>
      <circle cx="-135" cy="0" r="5" fill="#10b981" class="pulse-dot"/>
      <text x="5" y="5" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Customer Messaging Platforms
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" fill="#f8fafc" font-size="18" font-weight="500" letter-spacing="0.2">
      Live Chat • Shared Inboxes • AI Copilots • Omnichannel Support
    </text>

    <!-- Supporting Description Line -->
    <text x="600" y="232" fill="#94a3b8" font-size="14" font-weight="400">
      Enterprise SaaS Market Leaders &amp; Top Open-Source Self-Hosted Solutions
    </text>

    <!-- Quick Stat Badges / Metrics Row -->
    <g transform="translate(600, 288)">
      <!-- Badge 1 -->
      <g transform="translate(-180, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" fill="#38bdf8" font-size="11" font-weight="600">🚀 10 SaaS Leaders</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(0, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" fill="#a855f7" font-size="11" font-weight="600">⭐ Top Open-Source</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(180, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="0" y="4" fill="#10b981" font-size="11" font-weight="600">📊 Market Analysis</text>
      </g>
    </g>
  </g>
</svg>
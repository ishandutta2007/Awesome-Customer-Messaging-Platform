<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.02)}}@keyframes pulse{0%{opacity:.3;transform:scale(.95)}50%{opacity:.9;transform:scale(1.1)}}@keyframes shimmer{0%{opacity:.15}50%{opacity:.35}}.bubble{animation:float 6s ease-in-out infinite alternate}.bubble-delayed{animation:float 8s ease-in-out infinite alternate-reverse}.pulse-dot{animation:pulse 3s cubic-bezier(.4,0,.6,1) infinite}.wave-line{stroke-dasharray:8 6;animation:dashMove 20s linear infinite}.grid-glow{animation:shimmer 10s ease-in-out infinite alternate}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" opacity=".12"/><circle cx="1000" cy="280" r="160" fill="#a855
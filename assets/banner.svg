" y="25" fill="#f8fafc" font-size="12" font-weight="600">Live Support &amp; AI</text><text x="48" y="39" fill="#94a3b8" font-size="10">24/7 Real-Time Sync</text></g><g text-anchor="middle"><g transform="translate(600, 68)"><rect width="320" height="32" x="-160" y="-16" fill="#1e1e38" stroke="#6366f1" stroke-width="1" rx="16"/><circle cx="-135" cy="0" r="5" fill="#10b981" class="pulse-dot"/><text x="5" y="5" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM DIRECTORY</text></g><text x="600" y="152" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-.5">Customer Messaging Platforms</text><text x="600" y="196" fill="#f8fafc" font-size="18" font-weight="500" letter-spacing=".2">Live Chat • Shared Inboxes • AI Copilots • Omnichannel Support</text><text x="600" y="232" fill="#94a3b8" font-size="14" font-weight="400">Enterprise SaaS Market Leaders &amp; Top Open-Source Self-Hosted Solutions</text><g><g transform="translate(600, 288) translate(-180, 0)"><rect width="130" height="28" x="-65" y="-14" fill="#0f172a" stroke="#334155" stroke-width="1" rx="14"/><text x="0" y="4" fill="#38bdf8" font-size="11" font-weight="600">🚀 10 SaaS Leaders</text></g><g transform="translate(600, 288) translate(0, 0)"><rect width="140" height="28" x="-70" y="-14" fill="#0f172a" stroke="#334155" stroke-width="1" rx="14"/><text x="0" y="4" fill="#a855f7" font-size="11" font-weight="600">⭐ Top Open-Source</text></g><g transform="translate(600, 288) translate(180, 0)"><rect width="130" height="28" x="-65" y="-14" fill="#0f172a" stroke="#334155" stroke-width="1" rx="14"/><text x="0" y="4" fill="#10b981" font-size="11" font-weight="600">📊 Market Analysis</text></g></g></g></svg>